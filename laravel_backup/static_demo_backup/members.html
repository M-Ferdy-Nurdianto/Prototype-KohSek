<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | Kohi Sekai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF9; color: #7B7674; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .hover-lift { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-lift:hover { transform: translateY(-8px); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#B19685',
                        secondary: '#E8D3C9',
                        tertiary: '#D4BDB0',
                        neutral: '#7B7674',
                        background: '#FDFBF9',
                    },
                    borderRadius: { '4xl': '2rem' }
                }
            }
        }
    </script>
</head>
<body x-data="kohiApp">
    <!-- Navbar -->
    <nav class="fixed w-full z-50 transition-all duration-300 glass py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-extrabold tracking-tight text-primary">KOHI <span class="text-neutral font-light">SEKAI</span></a>
            <div class="hidden md:flex space-x-10 items-center">
                <a href="index.html" class="font-medium hover:text-primary transition-colors">Home</a>
                <a href="members.html" class="font-medium text-primary hover:text-primary transition-colors">Member</a>
                <a href="cheki.html" class="font-medium hover:text-primary transition-colors">Cheki</a>
                <a href="cheki.html" class="bg-primary text-white px-6 py-2.5 rounded-full font-semibold hover:bg-opacity-90 transition-all">Buy Cheki</a>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="pt-40 pb-20 bg-background overflow-hidden relative">
        <div class="container mx-auto px-6 relative z-10">
            <h1 class="text-6xl font-extrabold text-neutral mb-6" x-transition:enter="transition ease-out duration-1000" x-transition:enter-start="opacity-0 translate-y-10" x-transition:enter-end="opacity-100 translate-y-0">
                The <span class="text-primary italic">Members</span>
            </h1>
            <p class="text-lg text-neutral/60 max-w-2xl leading-relaxed">
                Meet the unique personalities that make up Kohi Sekai. Each member brings a different flavor to the group, creating a perfect blend of talent and charisma.
            </p>
        </div>
        <div class="absolute top-0 right-0 w-1/4 h-1/2 bg-primary/5 rounded-full blur-[100px] -translate-y-1/2"></div>
    </section>

    <!-- Members Grid -->
    <section class="py-20 bg-white">
        <div class="container mx-auto px-6">
            <div class="grid md:grid-cols-3 gap-12">
                <template x-for="member in members">
                    <div class="group">
                        <div class="relative mb-8 rounded-4xl overflow-hidden shadow-xl aspect-[3/4] hover-lift">
                            <img :src="member.image" :alt="member.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                            <div class="absolute inset-0 bg-gradient-to-t from-primary/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-8">
                                <div class="flex space-x-4">
                                    <a href="#" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary hover:bg-secondary transition-colors">
                                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                                    </a>
                                    <a href="#" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-primary hover:bg-secondary transition-colors">
                                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.84 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between items-end">
                                <h3 class="text-3xl font-extrabold text-neutral" x-text="member.name"></h3>
                                <span class="text-primary font-bold text-sm uppercase tracking-widest pb-1" x-text="member.role"></span>
                            </div>
                            <p class="text-neutral/60 leading-relaxed italic" x-text="member.description"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white py-20 border-t border-neutral/5">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-12">
                <a href="index.html" class="text-3xl font-extrabold text-primary mb-8 md:mb-0">KOHI <span class="text-neutral font-light">SEKAI</span></a>
                <div class="flex space-x-8">
                    <a href="#" class="text-neutral/60 hover:text-primary transition-colors">Instagram</a>
                    <a href="#" class="text-neutral/60 hover:text-primary transition-colors">Twitter</a>
                    <a href="#" class="text-neutral/60 hover:text-primary transition-colors">TikTok</a>
                </div>
            </div>
            <div class="pt-12 border-t border-neutral/5 text-sm text-neutral/40 text-center md:text-left">
                <p>&copy; 2026 Kohi Sekai. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
